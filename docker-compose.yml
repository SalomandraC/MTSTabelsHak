services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wikilive
      POSTGRES_USER: wikilive
      POSTGRES_PASSWORD: wikilive
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikilive -d wikilive"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  context-engine:
    build:
      context: ./services/context-engine
    environment:
      QDRANT_PERSIST_DIRECTORY: /data/qdrant
      CONTEXT_ENGINE_EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      CONTEXT_ENGINE_SEARCH_TOP_K: 5
    ports:
      - "8090:8090"
    volumes:
      - context-engine-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql://wikilive:wikilive@postgres:5432/wikilive?schema=public
      REDIS_URL: redis://redis:6379
      CONTEXT_ENGINE_URL: http://context-engine:8090
      DOCUMENT_GENERATOR_URL: http://docgen:3200
      PORT: 8080
      COLLAB_PORT: 8081
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      context-engine:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  docgen:
    build:
      context: ./document-generator
    environment:
      PORT: 3200
      API_BASE_URL: http://api:8080
    ports:
      - "3200:3200"

volumes:
  postgres-data:
  redis-data:
  context-engine-data:
