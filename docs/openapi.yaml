  /api/v1/pages/{pageId}/collab/session:
    post:
      tags: [Collaboration]
      summary: Создать или возобновить сессию совместного редактирования
      description: |
        Bootstrap-ручка для Tiptap collaboration.

        Используется перед подключением к WebSocket и возвращает:
        - идентификатор collaboration session
        - временный websocket token
        - URL канала совместного редактирования
        - последний серверный snapshot документа
        - информацию о серверной версии и checkpoint

        Именно эту ручку frontend должен вызывать при открытии редактора.
      operationId: openCollabSession
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenCollabSessionRequest'
      responses:
        '200':
          description: Сессия редактирования создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenCollabSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/pages/{pageId}/checkpoints:
    post:
      tags: [Collaboration]
      summary: Сохранить server checkpoint документа
      description: |
        Сохраняет compact snapshot документа после idle autosave, перед закрытием вкладки
        или при ручном действии "Save checkpoint".

        Ручка не заменяет real-time collaboration, а дополняет его:
        - ускоряет повторное открытие страницы
        - дает серверную точку восстановления
        - помогает после сетевых сбоев
      operationId: createCheckpoint
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckpointRequest'
      responses:
        '201':
          description: Checkpoint сохранен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

