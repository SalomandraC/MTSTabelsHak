x-websocket:
  channel: /ws/collaboration/pages/{pageId}
  summary: WebSocket-канал совместного редактирования страницы
  description: |
    OpenAPI не стандартизует WebSocket-сообщения так же подробно, как HTTP, поэтому канал описан
    как расширение спецификации.

    Канал используется для Tiptap + Yjs collaboration и отвечает за:
    - прием CRDT updates от клиентов
    - рассылку CRDT updates другим участникам
    - awareness/presence
    - курсоры и online-статусы

    Порядок использования:
    1. frontend вызывает `POST /api/v1/pages/{pageId}/collab/session`
    2. получает `websocket.url` и `websocket.token`
    3. подключается к WebSocket-каналу
    4. синхронизирует документ через сообщения ниже

  pathParameters:
    - name: pageId
      type: string
      format: uuid
  queryParameters:
    - name: sessionId
      type: string
      format: uuid
    - name: token
      type: string
  messages:
    - type: sync-init
      direction: client-to-server
      description: Клиент сообщает о начале Yjs sync handshake
      payload:
        type: object
        properties:
          type:
            type: string
            const: sync-init
          stateVector:
            type: string
            description: Base64 encoded Yjs state vector
    - type: sync-update
      direction: bidirectional
      description: Основное сообщение с CRDT update
      payload:
        type: object
        properties:
          type:
            type: string
            const: sync-update
          update:
            type: string
            description: Base64 encoded Yjs update
          clientId:
            type: string
    - type: awareness-update
      direction: bidirectional
      description: "Awareness-события Tiptap/Yjs: курсор, имя пользователя, цвет, выделение"
      payload:
        type: object
        properties:
          type:
            type: string
            const: awareness-update
          awareness:
            type: object
            additionalProperties: true
    - type: presence-join
      direction: server-to-clients
      description: Сервер сообщает, что участник вошел в документ
      payload:
        type: object
        properties:
          type:
            type: string
            const: presence-join
          user:
            $ref: '#/components/schemas/PresenceUser'
    - type: presence-leave
      direction: server-to-clients
      description: Сервер сообщает, что участник покинул документ
      payload:
        type: object
        properties:
          type:
            type: string
            const: presence-leave
          userId:
            type: string
    - type: error
      direction: server-to-client
      description: Ошибка синхронизации или авторизации канала
      payload:
        type: object
        properties:
          type:
            type: string
            const: error
          code:
            type: string
          message:
            type: string
