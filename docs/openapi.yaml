    get:
      tags: [MWS Fields]
      summary: Получить поля таблицы MWS Tables
      description: |
        Возвращает схему таблицы.
        Используется для:
        - рендера live embed
        - выбора колонок в настройках embed
        - отображения типов полей и сложных значений
      operationId: listMwsFields
      parameters:
        - $ref: '#/components/parameters/DatasheetId'
        - name: viewId
          in: query
          required: false
          description: Если указан, поля возвращаются в порядке заданного представления
          schema:
            type: string
      responses:
        '200':
          description: Поля получены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MwsFieldListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
    post:
      tags: [MWS Fields]
      summary: Создать поле в таблице MWS Tables
      description: |
        Позволяет из WikiLive расширять схему существующей таблицы.
        Используется в продвинутых сценариях конфигурации embed и операционного редактирования таблицы.
      operationId: createMwsField
      parameters:
        - $ref: '#/components/parameters/SpaceIdQueryOrHeader'
        - $ref: '#/components/parameters/DatasheetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMwsFieldRequest'
      responses:
        '201':
          description: Поле создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMwsFieldResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/v1/mws/datasheets/{datasheetId}/fields/{fieldId}:
    delete:
      tags: [MWS Fields]
      summary: Удалить поле таблицы MWS Tables
      operationId: deleteMwsField
      parameters:
        - $ref: '#/components/parameters/DatasheetId'
        - name: fieldId
          in: path
          required: true
          schema:
            type: string
        - name: spaceId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Поле удалено
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/v1/mws/datasheets/{datasheetId}/views/{viewId}/fields/{fieldId}/index:
    patch:
      tags: [MWS Fields, MWS Views]
      summary: Изменить позицию поля в представлении
      operationId: moveMwsField
      parameters:
        - $ref: '#/components/parameters/DatasheetId'
        - name: viewId
          in: path
          required: true
          schema:
            type: string
        - name: fieldId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [index]
              properties:
                index:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Позиция поля изменена
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/v1/mws/datasheets/{datasheetId}/views:
    get:
      tags: [MWS Views]
      summary: Получить представления таблицы MWS Tables
      description: |
        Возвращает все представления datasheet.
        Используется при вставке live embed, чтобы пользователь мог выбрать:
        - Grid
        - Kanban
        - Gallery
        - Calendar
        - Architecture
      operationId: listMwsViews
      parameters:
        - $ref: '#/components/parameters/DatasheetId'
      responses:
        '200':
          description: Представления получены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MwsViewListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
    post:
      tags: [MWS Views]
      summary: Создать новое представление таблицы
      description: |
        Создает новое представление datasheet в MWS Tables.
        Используется, когда нужно быстро сделать специальный view для отображения внутри WikiLive.
      operationId: createMwsView
      parameters:
        - $ref: '#/components/parameters/SpaceIdQueryOrHeader'
        - $ref: '#/components/parameters/DatasheetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMwsViewRequest'
      responses:
        '201':
          description: Представление создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMwsViewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/v1/mws/spaces/{spaceId}/datasheets/{datasheetId}/views/{viewId}/sort:
    post:
      tags: [MWS Views]
      summary: Применить сортировку view
      operationId: setMwsViewSort
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - $ref: '#/components/parameters/DatasheetId'
        - name: viewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              properties:
                rules:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                keepSort:
                  type: boolean
                  default: true
                applySort:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Сортировка применена
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/v1/mws/spaces/{spaceId}/datasheets/{datasheetId}/views/{viewId}/group:
    post:
      tags: [MWS Views]
      summary: Применить группировку view
      operationId: setMwsViewGroup
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - $ref: '#/components/parameters/DatasheetId'
        - name: viewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              properties:
                rules:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        '200':
          description: Группировка применена
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/v1/mws/datasheets/{datasheetId}/records:
    get:
      tags: [MWS Records]
      summary: Получить записи таблицы MWS Tables
      description: |
        Основная ручка для live embed таблицы.
        Возвращает записи datasheet с учетом view, пагинации, фильтрации и выбора полей.

        Используется:
        - для отображения встроенной таблицы внутри wiki-страницы
        - для режима preview в slash-menu picker
        - для lazy loading и прокрутки внутри embed-компонента
      operationId: listMwsRecords
      parameters:
        - $ref: '#/components/parameters/DatasheetId'
        - name: viewId
          in: query
          required: false
          description: Идентификатор view для чтения отфильтрованного и визуально согласованного набора записей
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          description: Размер страницы для прокрутки или пагинации внутри embed
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 1000
        - name: pageNum
          in: query
          required: false
          description: Номер страницы для серверной пагинации
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: fields
          in: query
          required: false
          description: Список fieldId для ограничения набора колонок в embed
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: filterByFormula
          in: query
          required: false
          description: Формульный фильтр MWS Tables для построения live-срезов таблицы
          schema:
            type: string
        - name: cellFormat
          in: query
          required: false
          description: Формат значения ячейки
          schema:
            type: string
            enum: [json, string]
            default: json
        - name: fieldKey
          in: query
          required: false
          description: Способ идентификации полей в ответе. Для интеграции рекомендуется id
          schema:
            type: string
            enum: [id, name]
            default: id
      responses:
        '200':
          description: Записи получены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MwsRecordListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
    post:
      tags: [MWS Records]
      summary: Создать записи в таблице MWS Tables
      description: |
        Используется для inline-операций из embed-компонента:
        - добавить новую строку
        - добавить несколько строк из шаблона
        - вставить результаты работы AI или slash-action
      operationId: createMwsRecords
      parameters:
        - $ref: '#/components/parameters/DatasheetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMwsRecordsRequest'
      responses:
        '201':
          description: Записи созданы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MwsRecordMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/v1/mws/datasheets/{datasheetId}/records/{recordId}/fields/{fieldId}:
    get:
      tags: [MWS Records]
      summary: Получить значение конкретной ячейки
      operationId: getMwsCellValue
      parameters:
        - $ref: '#/components/parameters/DatasheetId'
        - name: recordId
          in: path
          required: true
          schema:
            type: string
        - name: fieldId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Значение ячейки получено
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
    patch:
      tags: [MWS Records]
      summary: Обновить записи таблицы MWS Tables
      description: |
        Используется для редактирования строк прямо из live embed.
        Backend проксирует изменения в MWS Tables и возвращает обновленные записи в нормализованном формате.
      operationId: updateMwsRecords
      parameters:
        - $ref: '#/components/parameters/DatasheetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMwsRecordsRequest'
      responses:
        '200':
          description: Записи обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MwsRecordMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamError'
    delete:
      tags: [MWS Records]
      summary: Удалить записи таблицы MWS Tables
      description: |
        Используется для удаления строк из live embed.
        Обычно вызывается из inline table toolbar или action menu строки.
      operationId: deleteMwsRecords
      parameters:
        - $ref: '#/components/parameters/DatasheetId'
        - name: recordIds
          in: query
          required: true
          description: Список идентификаторов записей для удаления
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
      responses:
        '200':
          description: Записи удалены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMwsRecordsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/v1/mws/table-embeds/resolve:
    post:
      tags: [MWS Embeds]
      summary: Разрешить конфигурацию live embed таблицы
      description: |
        Агрегированная BFF-ручка для Tiptap embed.
        Вместо серии отдельных запросов frontend может отправить параметры целевого embed,
        а backend вернет уже собранный результат:
        - node info
        - datasheet info
        - доступные views
        - поля
        - preview records
        - права на inline editing

        Это основная ручка, которую следует использовать после выбора таблицы пользователем.
      operationId: resolveTableEmbed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveTableEmbedRequest'
      responses:
        '200':
          description: Конфигурация embed разрешена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveTableEmbedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/v1/mws/table-pages:
    post:
      tags: [MWS Embeds, Pages]
      summary: Создать или открыть WikiLive-страницу для MWS таблицы
      description: |
        Идемпотентная ручка для MWS-first проводника.
        Если WikiLive-страница для `spaceId + nodeId` уже есть, backend возвращает ее с `created=false`.
        Если страницы нет, backend создает документ с live `mwsTableEmbed` и привязкой к MWS node.
      operationId: createMwsTablePage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMwsTablePageRequest'
      responses:
        '201':
          description: Страница создана или найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMwsTablePageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/v1/mws/datasheets/{datasheetId}/attachments:
    post:
      tags: [MWS Attachments]
      summary: Загрузить вложение в таблицу MWS Tables
      description: |
        Позволяет прикрепить файл к таблице MWS Tables.
        Может использоваться:
        - из интерфейса live embed
        - в сценариях, где строка таблицы редактируется прямо из wiki-страницы
      operationId: uploadMwsAttachment
      parameters:
        - $ref: '#/components/parameters/DatasheetId'
        - name: recordId
          in: query
          required: false
          description: Идентификатор записи, если файл нужно загрузить прямо в ячейку записи
          schema:
            type: string
        - name: fieldId
          in: query
          required: false
          description: Идентификатор поля типа Attachment
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Вложение загружено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MwsAttachmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamError'
    get:
      tags: [MWS Attachments]
      summary: Скачать вложение по attachment token
      operationId: downloadMwsAttachment
      parameters:
        - $ref: '#/components/parameters/DatasheetId'
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Бинарный файл вложения
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageId:
      name: pageId
      in: path
      required: true
      description: Идентификатор wiki-страницы
      schema:
        type: string
        format: uuid
    SpaceId:
      name: spaceId
      in: path
      required: true
      description: Идентификатор пространства MWS Tables
      schema:
        type: string
    SpaceIdQueryOrHeader:
      name: spaceId
      in: query
      required: true
      description: Идентификатор пространства MWS Tables, необходимый для upstream-операций создания
      schema:
        type: string
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Идентификатор ноды MWS Tables
      schema:
        type: string
    DatasheetId:
      name: datasheetId
      in: path
      required: true
      description: Идентификатор таблицы MWS Tables
      schema:
        type: string

  responses:
    BadRequest:
      description: Запрос не прошел валидацию
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Пользователь не авторизован или токен недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Запрашиваемая сущность не найдена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamError:
      description: Ошибка при обращении к MWS Tables API
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpstreamErrorResponse'

  schemas:
    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          example: UP
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Request body is invalid
        details:
          type: object
          additionalProperties: true

    UpstreamErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            upstream:
              type: string
              example: MWS_TABLES
            upstreamStatus:
              type: integer
              example: 403

    PageSummary:
      type: object
      required: [id, title, createdAt, updatedAt, backlinksCount]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        icon:
          type: string
          nullable: true
        excerpt:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        backlinksCount:
          type: integer
          minimum: 0

    PageDocumentState:
      type: object
      description: Серверное представление compact CRDT snapshot документа
      properties:
        encoding:
          type: string
          enum: [base64-yjs-update-v2]
        value:
          type: string
          description: Base64-строка Yjs update/snapshot
        serverVersion:
          type: integer
          minimum: 0
        checkpointId:
          type: string
          format: uuid
          nullable: true
        persistedAt:
          type: string
          format: date-time
          nullable: true

    PageEmbed:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
          example: mwsTableEmbed
        title:
          type: string
          nullable: true
        datasheetId:
          type: string
          nullable: true
        viewId:
          type: string
          nullable: true
        displayMode:
          type: string
          enum: [table, board, gallery, calendar, architecture]
          nullable: true

    PageResponse:
      type: object
      required: [page]
      properties:
        page:
          type: object
          required: [id, title, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            title:
              type: string
            icon:
              type: string
              nullable: true
            isArchived:
              type: boolean
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            plainTextPreview:
              type: string
              nullable: true
            outgoingLinksCount:
              type: integer
            backlinksCount:
              type: integer
            embeds:
              type: array
              items:
                $ref: '#/components/schemas/PageEmbed'
            documentState:
              $ref: '#/components/schemas/PageDocumentState'

    PageListResponse:
      type: object
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PageSummary'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    PageInfo:
      type: object
      required: [hasNextPage]
      properties:
        nextCursor:
          type: string
          nullable: true
        hasNextPage:
          type: boolean

    CreatePageRequest:
      type: object
      required: [spaceId, title]
      properties:
        spaceId:
          type: string
        title:
          type: string
          maxLength: 255
        icon:
          type: string
          nullable: true
        parentNodeId:
          type: string
          format: uuid
          nullable: true
        initialContent:
