openapi: 3.1.0
info:
  title: WikiLive Backend API
  version: 1.0.0
  summary: API модуля WikiLive для совместного редактирования страниц и интеграции с MWS Tables
  description: |
    API описывает backend-контракт для модуля WikiLive.

    Основные задачи backend:
    - хранение и выдача wiki-страниц
    - индексация ссылок между страницами и обратных ссылок
    - bootstrap совместного редактирования через Tiptap + CRDT
    - проксирование и агрегация запросов к MWS Tables API
    - работа с live-embed таблицами внутри текста

    Архитектурная модель:
    - HTTP используется для CRUD-операций, загрузки страницы, backlinks, поиска страниц,
      а также для BFF-интеграции с MWS Tables
    - WebSocket используется для real-time collaboration документа:
      CRDT updates, awareness, presence и синхронизации редактора Tiptap
    - таблицы MWS Tables остаются источником истины по табличным данным
    - страницы WikiLive остаются источником истины по тексту, ссылкам, backlinks и CRDT-состоянию

    Важно:
    - контент документа синхронизируется через WebSocket-канал, а не через PATCH body документа
    - embed таблицы внутри страницы хранит только ссылку на сущность MWS Tables и параметры отображения
    - локальный autosave на фронте реализуется в browser storage, а backend хранит серверные checkpoints

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://wikilive.internal.example.com
    description: Example production server

tags:
  - name: Health
    description: Технические ручки для health-check и readiness
  - name: Auth
    description: Авторизация по API-ключу, refresh-сессии и профиль пользователя
  - name: Pages
    description: Работа с wiki-страницами и их метаданными
  - name: Links
    description: Навигация по связям между страницами и обратным ссылкам
  - name: Collaboration
    description: Bootstrap и контроль серверной синхронизации CRDT-документа
  - name: History
    description: История checkpoint-ов и восстановление состояния страницы
  - name: Comments
    description: Треды комментариев и сообщения в контексте страницы
  - name: Search
    description: Контекстный поиск по документам пространства
  - name: AI
    description: AI инструменты, чат и планирование действий
  - name: Plugins
    description: Каталог плагинов и пользовательские настройки/активация
  - name: Templates
    description: Каталог шаблонов, CRUD и инстанцирование в страницу
  - name: MWS Spaces
    description: Работа с пространствами MWS Tables
  - name: MWS Nodes
    description: Поиск и просмотр сущностей пространства MWS Tables
  - name: MWS Datasheets
    description: Создание и конфигурирование таблиц MWS Tables
  - name: MWS Fields
    description: Работа со схемой таблиц MWS Tables
  - name: MWS Views
    description: Работа с представлениями таблиц MWS Tables
  - name: MWS Records
    description: Чтение и изменение записей MWS Tables
  - name: MWS Embeds
    description: Агрегированные ручки для вставки таблиц в Tiptap
  - name: MWS Attachments
    description: Работа с вложениями таблиц MWS Tables

security:
  - bearerAuth: []

paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Проверка доступности backend-сервиса
      description: |
        Используется frontend, reverse proxy, Kubernetes/Docker health checks и демо-окружением,
        чтобы быстро понять, жив ли backend WikiLive.
      operationId: getHealth
      responses:
        '200':
          description: Backend работает штатно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Войти по MWS API-ключу
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiKey]
              properties:
                apiKey:
                  type: string
                displayName:
                  type: string
                  maxLength: 80
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresInSec, user]
                properties:
                  accessToken:
                    type: string
                  expiresInSec:
                    type: integer
                  user:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Обновить access token по refresh cookie
      operationId: refreshAuthToken
      security: []
      responses:
        '200':
          description: Access token обновлен
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresInSec]
                properties:
                  accessToken:
                    type: string
                  expiresInSec:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Выйти из сессии
      operationId: logout
      security: []
      responses:
        '204':
          description: Сессия завершена, refresh cookie очищен

  /api/v1/me:
    get:
      tags: [Auth]
      summary: Получить текущего пользователя
      operationId: getMe
      responses:
        '200':
          description: Профиль получен
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    type: object
                    properties:
                      userId:
                        type: string
                      clientId:
                        type: string
                        nullable: true
                      displayName:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Auth]
      summary: Обновить displayName текущего пользователя
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
                  maxLength: 80
      responses:
        '200':
          description: Профиль обновлен
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/pages:
    get:
      tags: [Pages]
      summary: Получить список страниц или выполнить поиск по страницам
      description: |
        Возвращает список страниц для sidebar, picker ссылок и slash-menu при вставке page-link.
        Если передан параметр `query`, backend выполняет поиск по заголовкам и индексу страниц.
        Параметр `spaceId` обязателен, потому что wiki-дерево и поисковый индекс изолированы по пространствам.
      operationId: listPages
      parameters:
        - name: spaceId
          in: query
          required: true
          description: Идентификатор wiki-пространства, внутри которого выполняется поиск страниц
          schema:
            type: string
        - name: query
          in: query
          required: false
          description: Строка поиска по заголовкам, slug и индексируемому plain-text preview
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Максимальное количество результатов
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Список страниц получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Pages]
      summary: Создать новую wiki-страницу
      description: |
        Создает страницу и базовые метаданные.
        Обычно вызывается из:
        - кнопки "New page"
        - slash-menu команды создания связанной страницы
        - сценариев "Create linked page"
        Страница всегда создается внутри иерархии пространства и может быть помещена в папку через `parentNodeId`.
      operationId: createPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePageRequest'
      responses:
        '201':
          description: Страница создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/spaces/{spaceId}/wiki/tree:
    get:
      tags: [Pages]
      summary: Получить дерево wiki-структуры пространства
      description: |
        Возвращает полную иерархию папок и страниц внутри пространства.
        Используется для sidebar navigation, page picker и перемещения страниц по дереву.
      operationId: getWikiTree
      parameters:
        - $ref: '#/components/parameters/SpaceId'
      responses:
        '200':
          description: Дерево wiki получено
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WikiTreeNode'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/spaces/{spaceId}/workspace/tree:
    get:
      tags: [Pages, MWS Nodes]
      summary: Получить MWS-first дерево пространства
      description: |
        Возвращает дерево пространства, где источником иерархии являются MWS Tables nodes.
        WikiLive-страницы накладываются поверх MWS-дерева как sibling-документы рядом с привязанными таблицами.
      operationId: getWorkspaceTree
      parameters:
        - $ref: '#/components/parameters/SpaceId'
      responses:
        '200':
          description: MWS-first дерево получено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceTreeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/v1/folders:
    post:
      tags: [Pages]
      summary: Создать папку в wiki-дереве
      description: |
        Создает папку внутри пространства или внутри другой папки.
        Папки являются first-class сущностями и используются для вложенной структуры вики.
      operationId: createFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
      responses:
        '201':
          description: Папка создана
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/folders/{folderId}:
    patch:
      tags: [Pages]
      summary: Обновить папку
      description: |
        Обновляет метаданные папки: название, иконку или архивный статус.
      operationId: updateFolder
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFolderRequest'
      responses:
        '200':
          description: Папка обновлена
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Pages]
      summary: Архивировать папку и вложенное поддерево
      description: |
        Выполняет soft-delete папки и всех вложенных страниц/папок.
      operationId: deleteFolder
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Папка архивирована
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/nodes/{nodeId}/move:
    post:
      tags: [Pages]
      summary: Переместить папку или страницу в дереве
      description: |
        Изменяет `parentId` и позицию ноды внутри нового родителя.
        Используется drag-and-drop навигацией и действиями в sidebar.
      operationId: moveNode
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveNodeRequest'
      responses:
        '200':
          description: Нода перемещена
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/pages/{pageId}:
    get:
      tags: [Pages]
      summary: Получить страницу для открытия в редакторе
      description: |
        Возвращает метаданные страницы, ссылки, состояние документа и информацию,
        необходимую для первичной инициализации Tiptap.

        Обычно frontend вызывает эту ручку перед открытием документа.
        Если параметр `includeDocumentState=true`, backend также возвращает последний серверный
        compact snapshot CRDT-документа.
      operationId: getPage
      security: []
      parameters:
        - $ref: '#/components/parameters/PageId'
        - name: includeDocumentState
          in: query
          required: false
          description: Нужно ли включить base64-представление последнего серверного snapshot документа
          schema:
            type: boolean
            default: true
        - name: readOnlyLink
          in: query
          required: false
          description: Признак открытия страницы по read-only share ссылке
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Страница найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Pages]
      summary: Обновить метаданные страницы
      description: |
        Обновляет только метаданные страницы:
        - заголовок
        - иконку
        - статус публикации
        - pinned/favorite флаги

        Контент документа через эту ручку не изменяется.
        Контент синхронизируется через WebSocket CRDT-канал.
      operationId: updatePage
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePageRequest'
      responses:
        '200':
          description: Метаданные страницы обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Pages]
      summary: Архивировать или удалить страницу
      description: |
        Используется для мягкого удаления страницы из WikiLive.
        В базовой реализации рекомендуется soft-delete, чтобы не ломать backlinks и историю.
      operationId: deletePage
      parameters:
        - $ref: '#/components/parameters/PageId'
      responses:
        '204':
          description: Страница удалена или переведена в архив
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/pages/{pageId}/access:
    get:
      tags: [Pages]
      summary: Получить политику доступов страницы
      operationId: getPageAccess
      security: []
      parameters:
        - $ref: '#/components/parameters/PageId'
      responses:
        '200':
          description: Политика доступов страницы
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Pages]
      summary: Обновить политику доступов страницы
      operationId: updatePageAccess
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [viewAccess, commentAccess, editAccess]
              properties:
                viewAccess:
                  type: string
                  enum: [owner_only, space_members, link_holders]
                commentAccess:
                  type: string
                  enum: [owner_only, space_members, link_holders]
                editAccess:
                  type: string
                  enum: [owner_only, space_members, link_holders]
      responses:
        '200':
          description: Политика доступов обновлена
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/pages/{pageId}/history:
    get:
      tags: [History]
      summary: Получить историю checkpoint-ов страницы
      operationId: listPageHistory
      parameters:
        - $ref: '#/components/parameters/PageId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: История страницы получена
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/pages/{pageId}/history/{checkpointId}:
    get:
      tags: [History]
      summary: Получить конкретный checkpoint страницы
      operationId: getPageCheckpoint
      parameters:
        - $ref: '#/components/parameters/PageId'
        - name: checkpointId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Checkpoint получен
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/pages/{pageId}/comments:
    get:
      tags: [Comments]
      summary: Получить треды комментариев страницы
      operationId: listCommentThreads
      parameters:
        - $ref: '#/components/parameters/PageId'
        - name: includeResolved
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Список тредов комментариев
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/pages/{pageId}/comments/threads:
    post:
      tags: [Comments]
      summary: Создать тред комментариев
      operationId: createCommentThread
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anchorId, anchorText, message]
              properties:
                anchorId:
                  type: string
                anchorText:
                  type: string
                message:
                  type: string
      responses:
        '201':
          description: Тред создан
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/pages/{pageId}/comments/threads/{threadId}:
    patch:
      tags: [Comments]
      summary: Обновить тред комментариев
      operationId: updateCommentThread
      parameters:
        - $ref: '#/components/parameters/PageId'
        - name: threadId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [open, resolved]
                resolveReason:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Тред обновлен
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/pages/{pageId}/comments/threads/{threadId}/messages:
    post:
      tags: [Comments]
      summary: Добавить сообщение в тред
      operationId: addCommentMessage
      parameters:
        - $ref: '#/components/parameters/PageId'
        - name: threadId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
      responses:
        '201':
          description: Сообщение добавлено
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/pages/{pageId}/comments/threads/{threadId}/messages/{messageId}:
    patch:
      tags: [Comments]
      summary: Обновить сообщение в треде
      operationId: updateCommentMessage
      parameters:
        - $ref: '#/components/parameters/PageId'
        - name: threadId
          in: path
          required: true
          schema:
            type: string
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
      responses:
        '200':
          description: Сообщение обновлено
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
